<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Umpan Balik Aksi Nyata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"],
        select,
        textarea {
            width: calc(100% - 22px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        input[type="file"] {
            padding: 10px 0;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 17px;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .review-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .review-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #007bff;
        }
        .review-item {
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .review-item strong {
            display: inline-block;
            width: 150px;
            color: #555;
        }
        .review-item img {
            max-width: 150px;
            height: auto;
            vertical-align: middle;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-left: 10px; /* Adjust margin to place image on the right */
        }
        .download-buttons {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 20px;
        }
        .download-buttons button {
            width: auto;
            flex-grow: 1;
            padding: 10px 15px;
            font-size: 16px;
        }
        .download-buttons button.edit {
            background-color: #6c757d;
        }
        .download-buttons button.edit:hover {
            background-color: #5a6268;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            .download-buttons {
                flex-direction: column;
            }
            .review-item strong {
                width: 100px; /* Smaller width for labels on small screens */
            }
            .review-item img {
                margin-top: 10px; /* Push image below text on small screens if necessary */
                display: block; /* Make image block level to stack */
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Formulir Umpan Balik Aksi Nyata <br>PPG Guru Tertentu</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="fullName">Nama Lengkap:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="position">Jabatan:</label>
                <select id="position" name="position" required>
                    <option value="">Pilih Jabatan</option>
                    <option value="Guru Kelas 1">Guru Kelas 1</option>
                    <option value="Guru Kelas 2">Guru Kelas 2</option>
                    <option value="Guru Kelas 3">Guru Kelas 3</option>
                    <option value="Guru Kelas 4">Guru Kelas 4</option>
                    <option value="Guru Kelas 5">Guru Kelas 5</option>
                    <option value="Guru Kelas 6">Guru Kelas 6</option>
                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                    <option value="Guru PJOK">Guru PJOK</option>
                </select>
            </div>

            <div class="form-group">
                <label for="actionType">Aksi Nyata:</label>
                <select id="actionType" name="actionType" required>
                    <option value="">Pilih Aksi Nyata</option>
                    <option value="Aksi nyata Menerapkan Prinsip UbD">Aksi nyata Menerapkan Prinsip UbD</option>
                    <option value="Aksi nyata Pembelajaran Berdiferensiasi">Aksi nyata Pembelajaran Berdiferensiasi</option>
                    <option value="Merancang Pembelajaran Berbasis Pendekatan TaRL">Aksi nyata Merancang Pembelajaran Berbasis Pendekatan TaRL</option>
                    <option value="Merancang Pembelajaran Berbasis CRT">Aksi nyata Merancang Pembelajaran Berbasis CRT</option>
                    <option value="Aksi nyata Pembelajaran Sosial Emosional">Aksi nyata Pembelajaran Sosial Emosional</option>
                    <option value="Pendidikan Inklusif Anak Berkebutuhan Khusus">Pendidikan Inklusif Anak Berkebutuhan Khusus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="feedbackText">Umpan Balik Terhadap Aksi Nyata:</label>
                <textarea id="feedbackText" name="feedbackText" required></textarea>
            </div>

            <div class="form-group">
                <label for="photoUpload">Unggah Foto (Opsional):</label>
                <input type="file" id="photoUpload" name="photoUpload" accept="image/*">
            </div>

            <button type="button" onclick="reviewFeedback()">Review</button>
        </form>

        <div class="review-section" id="reviewSection">
            <h3>Umpan Balik Teman Sejawat</h3>
            <div class="review-content">
                <div class="review-item"><strong>Nama Lengkap:</strong> <span id="reviewFullName"></span></div>
                <div class="review-item"><strong>Jabatan:</strong> <span id="reviewPosition"></span></div>
                <div class="review-item"><strong>Aksi Nyata:</strong> <span id="reviewActionType"></span></div>
                <div class="review-item"><strong>Umpan Balik:</strong> <span id="reviewFeedbackText"></span></div>
                <div class="review-item"><strong>Foto:</strong> <img id="reviewPhoto" src="#" alt="Foto Umpan Balik" style="display: none;"></div>
            </div>
            <div class="download-buttons">
                <button type="button" onclick="downloadFeedback()">Unduh Respons</button>
                <button type="button" class="edit" onclick="editFeedback()">Edit Umpan Balik</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let resizedImageBase64 = null; // To store the resized image data

        document.getElementById('photoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const MAX_WIDTH = 300; // Maximum width for the image
                        const MAX_HEIGHT = 300; // Maximum height for the image
                        let width = img.width;
                        let height = img.height;

                        // Calculate new dimensions while maintaining aspect ratio
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resizedImageBase64 = canvas.toDataURL('image/jpeg', 0.8); // Convert to JPEG with 80% quality
                    };
                };
                reader.readAsDataURL(file);
            } else {
                resizedImageBase64 = null;
            }
        });

        function reviewFeedback() {
            const fullName = document.getElementById('fullName').value;
            const position = document.getElementById('position').value;
            const actionType = document.getElementById('actionType').value;
            const feedbackText = document.getElementById('feedbackText').value;

            if (!fullName || !position || !actionType || !feedbackText) {
                alert('Harap lengkapi semua kolom yang wajib diisi.');
                return;
            }

            document.getElementById('reviewFullName').textContent = fullName;
            document.getElementById('reviewPosition').textContent = position;
            document.getElementById('reviewActionType').textContent = actionType;
            document.getElementById('reviewFeedbackText').textContent = feedbackText;

            const reviewPhoto = document.getElementById('reviewPhoto');
            if (resizedImageBase64) {
                reviewPhoto.src = resizedImageBase64;
                reviewPhoto.style.display = 'inline-block';
            } else {
                reviewPhoto.src = '#';
                reviewPhoto.style.display = 'none';
            }

            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('reviewSection').style.display = 'block';
        }

        function editFeedback() {
            document.getElementById('feedbackForm').style.display = 'block';
            document.getElementById('reviewSection').style.display = 'none';
        }

        function downloadFeedback() {
            const reviewSection = document.getElementById('reviewSection');
            const originalDisplay = reviewSection.style.display; // Store original display

            // Temporarily set display to block and position to ensure visibility for html2canvas
            reviewSection.style.display = 'block';
            reviewSection.style.position = 'relative'; // Ensure it's rendered correctly
            reviewSection.style.backgroundColor = '#fff'; // Set background for screenshot

            // Create a temporary container to hold the content for screenshotting
            const tempDiv = document.createElement('div');
            tempDiv.style.width = '100%';
            tempDiv.style.padding = '20px';
            tempDiv.style.boxSizing = 'border-box';
            tempDiv.style.backgroundColor = '#fff'; // Ensure white background for the generated image

            // Clone the review content for screenshotting
            const reviewContentClone = reviewSection.querySelector('.review-content').cloneNode(true);
            tempDiv.appendChild(reviewContentClone);

            // Append the temporary div to body for html2canvas to process
            document.body.appendChild(tempDiv);

            html2canvas(tempDiv, {
                scale: 2, // Increase scale for better quality
                useCORS: true, // Needed if you are loading images from different origins
                backgroundColor: '#ffffff' // Ensure background is white
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'umpan_balik_aksi_nyata.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9); // Convert to JPG with 90% quality
                link.click();

                // Clean up: remove the temporary div
                document.body.removeChild(tempDiv);

                // Restore original display
                reviewSection.style.display = originalDisplay;
                reviewSection.style.position = '';
                reviewSection.style.backgroundColor = '';
            }).catch(error => {
                console.error("Oops, something went wrong!", error);
                alert("Gagal mengunduh umpan balik. Silakan coba lagi.");
                // Restore original display even if an error occurs
                reviewSection.style.display = originalDisplay;
                reviewSection.style.position = '';
                reviewSection.style.backgroundColor = '';
            });
        }
    </script>
</body>
</html>
