<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Umpan Balik Aksi Nyata</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        select,
        textarea {
            width: calc(100% - 22px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input[type="file"] {
            display: block;
            padding: 8px 0;
        }
        .image-preview-container {
            margin-top: 15px;
            text-align: center;
            border: 1px dashed #ccc;
            padding: 10px;
            border-radius: 6px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            display: none; /* Hidden until image is loaded */
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            color: #fff;
        }
        button#reviewBtn {
            background-color: #007bff;
        }
        button#reviewBtn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        button#downloadBtn {
            background-color: #28a745;
            display: none; /* Hidden until review */
        }
        button#downloadBtn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        #reviewOutput {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f0f8ff;
            display: none; /* Hidden until review */
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            line-height: 1.6;
        }
        #reviewOutput h3 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 15px;
        }
        #reviewContent {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            justify-content: center;
            align-items: flex-start;
        }
        #reviewText {
            flex: 2; /* Takes more space */
            min-width: 280px; /* Minimum width for text */
        }
        #reviewImageContainer {
            flex: 1; /* Takes less space */
            min-width: 150px; /* Minimum width for image */
            text-align: center;
        }
        #reviewImage {
            max-width: 180px; /* Adjust as needed */
            max-height: 180px; /* Adjust as needed */
            border: 1px solid #ddd;
            border-radius: 5px;
            object-fit: cover; /* Ensures image covers area without distortion */
        }
        #reviewOutput p {
            margin-bottom: 10px;
            color: #333;
        }
        #reviewOutput p strong {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Form Umpan Balik Aksi Nyata<br>PPG Guru Tertentu</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="fullName">Nama Lengkap:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="position">Jabatan:</label>
                <select id="position" name="position" required>
                    <option value="">Pilih Jabatan</option>
                    <option value="Guru Kelas 1">Guru Kelas 1</option>
                    <option value="Guru Kelas 2">Guru Kelas 2</option>
                    <option value="Guru Kelas 3">Guru Kelas 3</option>
                    <option value="Guru Kelas 4">Guru Kelas 4</option>
                    <option value="Guru Kelas 5">Guru Kelas 5</option>
                    <option value="Guru Kelas 6">Guru Kelas 6</option>
                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                    <option value="Guru PJOK">Guru PJOK</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aksiNyata">Aksi Nyata:</label>
                <select id="aksiNyata" name="aksiNyata" required>
                    <option value="">Pilih Aksi Nyata</option>
                    <option value="Pembelajaran Berdiferensiasi">Aksi Nyata Pembelajaran Berdiferensiasi</option>
                    <option value="Pembelajaran Sosial Emosional">Aksi Nyata Pembelajaran Sosial Emosional</option>
                    <option value="Pendidikan Inklusif Anak Berkebutuhan Khusus">Pendidikan Inklusif Anak Berkebutuhan Khusus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="photoUpload">Unggah Foto (Ukuran Maksimal 500KB, Otomatis Disusutkan):</label>
                <input type="file" id="photoUpload" name="photoUpload" accept="image/*">
                <div class="image-preview-container">
                    <img id="imagePreview" src="#" alt="Pratinjau Gambar">
                </div>
            </div>

            <div class="form-group">
                <label for="feedback">Umpan Balik terhadap Aksi Nyata:</label>
                <textarea id="feedback" name="feedback" required></textarea>
            </div>

            <div class="button-group">
                <button type="button" id="reviewBtn">Review Jawaban</button>
                <button type="button" id="downloadBtn">Download Respon (JPG)</button>
            </div>
        </form>

        <div id="reviewOutput">
            <h3>Umpan Balik Teman Sejawat</h3>
            <div id="reviewContent">
                <div id="reviewText">
                    <p><strong>Nama Lengkap:</strong> <span id="reviewFullName"></span></p>
                    <p><strong>Jabatan:</strong> <span id="reviewPosition"></span></p>
                    <p><strong>Aksi Nyata:</strong> <span id="reviewAksiNyata"></span></p>
                    <p><strong>Umpan Balik:</strong> <span id="reviewFeedback"></span></p>
                </div>
                <div id="reviewImageContainer">
                    <img id="reviewImage" src="#" alt="Foto Umpan Balik">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const photoUpload = document.getElementById('photoUpload');
        const imagePreview = document.getElementById('imagePreview');
        const reviewBtn = document.getElementById('reviewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const reviewOutput = document.getElementById('reviewOutput');
        const reviewFullName = document.getElementById('reviewFullName');
        const reviewPosition = document.getElementById('reviewPosition');
        const reviewAksiNyata = document.getElementById('reviewAksiNyata');
        const reviewFeedback = document.getElementById('reviewFeedback');
        const reviewImage = document.getElementById('reviewImage');
        let resizedImageBase64 = null; // To store the base64 of the resized image

        photoUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const MAX_WIDTH = 400; // Max width for the resized image
                        const MAX_HEIGHT = 400; // Max height for the resized image
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Convert canvas to base64 with JPEG format and quality
                        resizedImageBase64 = canvas.toDataURL('image/jpeg', 0.8); // 0.8 is quality
                        imagePreview.src = resizedImageBase64;
                        imagePreview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.style.display = 'none';
                imagePreview.src = '#';
                resizedImageBase64 = null;
            }
        });

        reviewBtn.addEventListener('click', function() {
            const fullName = document.getElementById('fullName').value;
            const position = document.getElementById('position').value;
            const aksiNyata = document.getElementById('aksiNyata').value;
            const feedback = document.getElementById('feedback').value;

            if (!fullName || !position || !aksiNyata || !feedback) {
                alert('Mohon lengkapi semua kolom sebelum me-review.');
                return;
            }

            reviewFullName.textContent = fullName;
            reviewPosition.textContent = position;
            reviewAksiNyata.textContent = aksiNyata;
            reviewFeedback.textContent = feedback;

            if (resizedImageBase64) {
                reviewImage.src = resizedImageBase64;
                reviewImage.style.display = 'block';
            } else {
                reviewImage.style.display = 'none';
                reviewImage.src = '#';
            }

            reviewOutput.style.display = 'block';
            downloadBtn.style.display = 'inline-block'; // Show download button
        });

        downloadBtn.addEventListener('click', function() {
            // Temporarily hide the buttons for clean screenshot
            reviewBtn.style.display = 'none';
            downloadBtn.style.display = 'none';

            // Use html2canvas to capture the reviewOutput div
            html2canvas(reviewOutput, {
                scale: 2, // Increase scale for better quality
                useCORS: true // Essential if images are loaded from different origins (though here it's base64)
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Umpan_Balik_Aksi_Nyata.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9); // 0.9 is quality for download
                link.click();
            });

            // Bring buttons back
            reviewBtn.style.display = 'inline-block';
            downloadBtn.style.display = 'inline-block';
        });
    </script>
</body>
</html>
