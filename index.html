<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpan Balik Aksi Nyata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        input[type="file"] {
            padding: 5px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button.review {
            background-color: #007bff;
            color: white;
        }
        button.review:hover {
            background-color: #0056b3;
        }
        button.submit {
            background-color: #28a745;
            color: white;
        }
        button.submit:hover {
            background-color: #218838;
        }
        #reviewModal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 30px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 15px;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .review-item {
            margin-bottom: 10px;
        }
        .review-item strong {
            display: inline-block;
            width: 120px; /* Adjust as needed for alignment */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Umpan Balik Aksi Nyata</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="namaLengkap">Nama Lengkap:</label>
                <input type="text" id="namaLengkap" name="namaLengkap" required>
            </div>

            <div class="form-group">
                <label for="jabatan">Jabatan:</label>
                <select id="jabatan" name="jabatan" required>
                    <option value="">Pilih Jabatan</option>
                    <option value="Guru Kelas 1">Guru Kelas 1</option>
                    <option value="Guru Kelas 2">Guru Kelas 2</option>
                    <option value="Guru Kelas 3">Guru Kelas 3</option>
                    <option value="Guru Kelas 4">Guru Kelas 4</option>
                    <option value="Guru Kelas 5">Guru Kelas 5</option>
                    <option value="Guru Kelas 6">Guru Kelas 6</option>
                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                    <option value="Guru PJOK">Guru PJOK</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aksiNyata">Aksi Nyata:</label>
                <select id="aksiNyata" name="aksiNyata" required>
                    <option value="">Pilih Aksi Nyata</option>
                    <option value="Pembelajaran Berdiferensiasi">Aksi Nyata Pembelajaran Berdiferensiasi</option>
                    <option value="Pembelajaran Sosial Emosional">Aksi Nyata Pembelajaran Sosial Emosional</option>
                    <option value="Pendidikan Inklusif Anak Berkebutuhan Khusus">Pendidikan Inklusif Anak Berkebutuhan Khusus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="unggahFoto">Unggah Foto (Opsional):</label>
                <input type="file" id="unggahFoto" name="unggahFoto" accept="image/*">
            </div>

            <div class="form-group">
                <label for="umpanBalik">Umpan Balik Terhadap Aksi Nyata:</label>
                <textarea id="umpanBalik" name="umpanBalik" rows="5" required></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="review" onclick="openReviewModal()">Review Sebelum Kirim</button>
                <button type="submit" class="submit">Kirim Umpan Balik</button>
            </div>
        </form>
    </div>

    <div id="reviewModal">
        <div class="modal-content">
            <span class="close-button" onclick="closeReviewModal()">&times;</span>
            <h3>Review Umpan Balik Anda</h3>
            <div id="reviewContent"></div>
            <div class="button-group" style="justify-content: center;">
                <button type="button" class="submit" onclick="submitFeedback()">Kirim Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        const targetEmail = 'arisatria19@guru.smp.belajar.id'; // Ganti dengan alamat email tujuan Anda

        document.getElementById('feedbackForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah form submit default

            // Hanya untuk memberikan konfirmasi visual bahwa tombol kirim di formulir utama ditekan
            // Pengiriman sebenarnya akan ditangani oleh tombol "Kirim Sekarang" di modal review
            alert('Silakan review umpan balik Anda terlebih dahulu!');
        });

        function openReviewModal() {
            const namaLengkap = document.getElementById('namaLengkap').value;
            const jabatan = document.getElementById('jabatan').value;
            const aksiNyata = document.getElementById('aksiNyata').value;
            const umpanBalik = document.getElementById('umpanBalik').value;
            const unggahFotoInput = document.getElementById('unggahFoto');
            const fotoName = unggahFotoInput.files.length > 0 ? unggahFotoInput.files[0].name : 'Tidak ada foto diunggah';

            if (!namaLengkap || !jabatan || !aksiNyata || !umpanBalik) {
                alert('Harap lengkapi semua kolom yang wajib diisi (Nama Lengkap, Jabatan, Aksi Nyata, dan Umpan Balik).');
                return;
            }

            const reviewContent = document.getElementById('reviewContent');
            reviewContent.innerHTML = `
                <div class="review-item"><strong>Nama Lengkap:</strong> ${namaLengkap}</div>
                <div class="review-item"><strong>Jabatan:</strong> ${jabatan}</div>
                <div class="review-item"><strong>Aksi Nyata:</strong> ${aksiNyata}</div>
                <div class="review-item"><strong>Unggah Foto:</strong> ${fotoName}</div>
                <div class="review-item"><strong>Umpan Balik:</strong> <br>${umpanBalik.replace(/\n/g, '<br>')}</div>
            `;
            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        function submitFeedback() {
            const namaLengkap = document.getElementById('namaLengkap').value;
            const jabatan = document.getElementById('jabatan').value;
            const aksiNyata = document.getElementById('aksiNyata').value;
            const umpanBalik = document.getElementById('umpanBalik').value;
            const unggahFotoInput = document.getElementById('unggahFoto');
            const fotoName = unggahFotoInput.files.length > 0 ? unggahFotoInput.files[0].name : 'Tidak ada foto diunggah';

            // Membangun body email
            let emailBody = `
Nama Lengkap: ${namaLengkap}
Jabatan: ${jabatan}
Aksi Nyata: ${aksiNyata}
Unggah Foto: ${fotoName}
Umpan Balik Terhadap Aksi Nyata:
${umpanBalik}
            `.trim();

            const subject = encodeURIComponent(`Umpan Balik Aksi Nyata: ${aksiNyata}`);
            const body = encodeURIComponent(emailBody);

            // Perlu diingat bahwa `mailto:` tidak dapat melampirkan file.
            // Pengguna perlu melampirkan file secara manual di aplikasi email mereka.
            // Pesan ini akan muncul di aplikasi email mereka.

            window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;

            closeReviewModal();
            alert('Umpan balik Anda telah disiapkan di aplikasi email Anda. Silakan tekan tombol kirim di aplikasi email Anda.');
            document.getElementById('feedbackForm').reset(); // Reset form setelah dikirim
        }
    </script>
</body>
</html>
