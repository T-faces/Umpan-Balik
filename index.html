<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Umpan Balik Aksi Nyata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input[type="file"] {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .image-preview-container {
            margin-top: 15px;
            text-align: center;
        }
        #imagePreview {
            max-width: 150px;
            max-height: 150px;
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 4px;
            display: none; /* Sembunyikan secara default */
        }
        .button-group {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin: 0 10px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #reviewModal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            position: relative;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .review-field {
            margin-bottom: 10px;
        }
        .review-field strong {
            display: inline-block;
            width: 120px;
        }
        #reviewImage {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 4px;
        }
        .download-options {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulir Umpan Balik Aksi Nyata<br>PPG Guru Tertentu</h1>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="fullName">Nama Lengkap:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="position">Jabatan:</label>
                <select id="position" name="position" required>
                    <option value="">Pilih Jabatan</option>
                    <option value="Guru Kelas 1">Guru Kelas 1</option>
                    <option value="Guru Kelas 2">Guru Kelas 2</option>
                    <option value="Guru Kelas 3">Guru Kelas 3</option>
                    <option value="Guru Kelas 4">Guru Kelas 4</option>
                    <option value="Guru Kelas 5">Guru Kelas 5</option>
                    <option value="Guru Kelas 6">Guru Kelas 6</option>
                    <option value="Kepala Sekolah">Kepala Sekolah</option>
                    <option value="Guru PJOK">Guru PJOK</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label for="actionType">Aksi Nyata:</label>
                <select id="actionType" name="actionType" required>
                    <option value="">Pilih Aksi Nyata</option>
                    <option value="Aksi nyata Pembelajaran Berdiferensiasi">Aksi nyata Pembelajaran Berdiferensiasi</option>
                    <option value="Aksi nyata Pembelajaran Sosial Emosional">Aksi nyata Pembelajaran Sosial Emosional</option>
                    <option value="Pendidikan Inklusif Anak Berkebutuhan Khusus">Pendidikan Inklusif Anak Berkebutuhan Khusus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="photoUpload">Unggah Foto:</label>
                <input type="file" id="photoUpload" name="photoUpload" accept="image/*" onchange="previewImage(event)">
                <div class="image-preview-container">
                    <img id="imagePreview" src="#" alt="Pratinjau Gambar">
                </div>
            </div>

            <div class="form-group">
                <label for="feedback">Umpan Balik Terhadap Aksi Nyata:</label>
                <textarea id="feedback" name="feedback" required></textarea>
            </div>

            <div class="button-group">
                <button type="button" onclick="reviewResponse()">Tinjau & Unduh</button>
            </div>
        </form>
    </div>

    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2>Tinjau Umpan Balik Anda</h2>
            <div id="reviewContent">
                <div class="review-field"><strong>Nama Lengkap:</strong> <span id="reviewFullName"></span></div>
                <div class="review-field"><strong>Jabatan:</strong> <span id="reviewPosition"></span></div>
                <div class="review-field"><strong>Aksi Nyata:</strong> <span id="reviewActionType"></span></div>
                <div class="review-field"><strong>Umpan Balik:</strong> <span id="reviewFeedback"></span></div>
                <div class="review-field">
                    <strong>Foto:</strong> <br>
                    <img id="reviewImage" src="#" alt="Foto Umpan Balik">
                </div>
            </div>
            <div class="download-options">
                <button onclick="downloadAsJPG()">Unduh</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let resizedImageBase64 = null;

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                output.style.display = 'block';
                resizeImage(reader.result);
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function resizeImage(base64Str) {
            const img = new Image();
            img.src = base64Str;
            img.onload = function() {
                const MAX_WIDTH = 300; // Ukuran maksimum untuk pratinjau dan unduhan
                const MAX_HEIGHT = 300;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resizedImageBase64 = canvas.toDataURL('image/jpeg', 0.9); // Kualitas JPG 0.9
            };
        }

        function reviewResponse() {
            const fullName = document.getElementById('fullName').value;
            const position = document.getElementById('position').value;
            const actionType = document.getElementById('actionType').value;
            const feedback = document.getElementById('feedback').value;

            if (!fullName || !position || !actionType || !feedback) {
                alert('Mohon lengkapi semua kolom formulir.');
                return;
            }

            document.getElementById('reviewFullName').textContent = fullName;
            document.getElementById('reviewPosition').textContent = position;
            document.getElementById('reviewActionType').textContent = actionType;
            document.getElementById('reviewFeedback').textContent = feedback;
            
            const reviewImageElement = document.getElementById('reviewImage');
            if (resizedImageBase64) {
                reviewImageElement.src = resizedImageBase64;
                reviewImageElement.style.display = 'block';
            } else {
                reviewImageElement.style.display = 'none';
                reviewImageElement.src = '#'; // Bersihkan src jika tidak ada gambar
            }

            document.getElementById('reviewModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        async function downloadAsJPG() {
            const reviewContent = document.getElementById('reviewContent');

            // Sembunyikan tombol unduh sementara agar tidak ikut tercetak
            const downloadButton = document.querySelector('.download-options');
            downloadButton.style.display = 'none';

            // Memberikan sedikit waktu agar DOM diperbarui sebelum di-render
            await new Promise(resolve => setTimeout(resolve, 50));

            html2canvas(reviewContent, { 
                scale: 2, // Meningkatkan resolusi gambar hasil
                useCORS: true // Penting jika ada gambar dari domain lain, meskipun di sini lokal
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Umpan_Balik_Aksi_Nyata.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95); // Kualitas JPG 0.95
                link.click();

                // Tampilkan kembali tombol unduh
                downloadButton.style.display = 'block';
                closeModal();
            });
        }
    </script>
</body>
</html>
